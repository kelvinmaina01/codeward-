AWSTemplateFormatVersion: '2010-09-09'
Description: 'Codeward ECS Fargate Services - Decoupled API (behind ALB) and Standalone Background Worker'

Parameters:
  EnvironmentName:
    Type: String
    Default: codeward-prod

  ClusterName:
    Type: String
    Default: codeward-cluster

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0f8bf8aee99ecc01b

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Private Subnet 1 for Fargate tasks

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Private Subnet 2 for Fargate tasks

  TargetGroupArn:
    Type: String
    Default: arn:aws:elasticloadbalancing:eu-north-1:<YOUR_AWS_ACCOUNT_ID>:targetgroup/codeward-api-tg/e58ede887bd4132c

  ImageUri:
    Type: String
    Default: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.eu-north-1.amazonaws.com/codeward-api:latest

  DatabaseUrl:
    Type: String
    NoEcho: true
    # TODO(DevOps): These endpoints were scrubbed for Open Source. Inject real values via CI/CD secrets during deployment.
    Description: Full PostgreSQL connection URL (e.g. postgresql://postgres:PASSWORD@<INJECT_RDS_ENDPOINT_HERE>:5432/codeward)

  RedisUrl:
    Type: String
    # TODO(DevOps): These endpoints were scrubbed for Open Source. Inject real values via CI/CD secrets during deployment.
    Default: rediss://<INJECT_VALKEY_ENDPOINT_HERE>:6379

  ApiUrl:
    Type: String
    Default: http://<YOUR_ALB_HOSTNAME>

  FrontendUrl:
    Type: String
    Default: https://www.codeward.cloud

Resources:
  # ─── CloudWatch Log Groups (7 days retention to avoid storage cost) ───────────
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/codeward-api
      RetentionInDays: 7

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/codeward-worker
      RetentionInDays: 7

  # ─── ECS Task Execution Role (Pull from ECR & send logs) ─────────────────────
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SsmParameterStoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'


  # ─── ECS Task Role (Allows container to call Bedrock Claude models!) ──────────
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetInferenceProfile
                  - bedrock:ListInferenceProfiles
                Resource: '*'

  # ─── Security Group for ECS Tasks ─────────────────────────────────────────────
  EcsTasksSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Codeward ECS Fargate tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 10.0.0.0/16
          Description: Allow incoming HTTP on port 3000 from ALB inside the VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound to RDS, Valkey, and NAT instance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ecs-tasks-sg'

  # ─── Task Definition 1: API (HTTP Server behind ALB) ─────────────────────────
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: codeward-api
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: codeward-api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: '3000'
            - Name: NODE_ENV
              Value: production
            - Name: RUN_WORKER_INLINE
              Value: 'false'
            - Name: SKIP_SECRET_VALIDATION
              Value: 'true'
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: REDIS_URL
              Value: !Ref RedisUrl
            - Name: UPSTASH_REDIS_URL
              Value: !Ref RedisUrl
            - Name: API_URL
              Value: !Ref ApiUrl
            - Name: FRONTEND_URL
              Value: !Ref FrontendUrl
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
            - Name: AI_ENGINE
              Value: bedrock
            - Name: BEDROCK_REGION
              Value: 'us-east-1'
            - Name: BETTER_AUTH_URL
              Value: !Ref ApiUrl
            - Name: SANDBOX_PROVIDER
              Value: 'e2b'
          Secrets:
            - Name: GITHUB_APP_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_APP_ID'
            - Name: GITHUB_CLIENT_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_CLIENT_ID'
            - Name: GITHUB_CLIENT_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_CLIENT_SECRET'
            - Name: GITHUB_WEBHOOK_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_WEBHOOK_SECRET'
            - Name: GITHUB_PRIVATE_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_PRIVATE_KEY'
            - Name: BETTER_AUTH_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/BETTER_AUTH_SECRET'
            - Name: GOOGLE_CLIENT_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GOOGLE_CLIENT_ID'
            - Name: GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GOOGLE_CLIENT_SECRET'
            - Name: FLY_API_TOKEN
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/FLY_API_TOKEN'
            - Name: E2B_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/E2B_API_KEY'
            - Name: OPENAI_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/OPENAI_API_KEY'
            - Name: AGENTROUTER_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/AGENTROUTER_API_KEY'
            - Name: TOKENROUTER_BASE_URL
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_BASE_URL'
            - Name: TOKENROUTER_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_API_KEY'
            - Name: TOKENROUTER_MODEL
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_MODEL'
            - Name: TOKENROUTER_GLM_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_GLM_API_KEY'
            - Name: TOKENROUTER_GPT_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_GPT_API_KEY'
            - Name: FALLOW_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/FALLOW_API_KEY'
            - Name: FALLOW_API_ENDPOINT
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/FALLOW_API_ENDPOINT'
            - Name: POLAR_ACCESS_TOKEN
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_ACCESS_TOKEN'
            - Name: POLAR_ORGANIZATION_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_ORGANIZATION_ID'
            - Name: POLAR_WEBHOOK_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_WEBHOOK_SECRET'
            - Name: POLAR_TEAM_PRODUCT_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_TEAM_PRODUCT_ID'
            - Name: POLAR_PRO_PRODUCT_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_PRO_PRODUCT_ID'
            - Name: RESEND_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/RESEND_API_KEY'
            - Name: BREVO_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/BREVO_API_KEY'
            - Name: QUICKEMAILVERIFICATION_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/QUICKEMAILVERIFICATION_API_KEY'
            - Name: EUSEND_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/EUSEND_API_KEY'
            - Name: EUSEND_FROM_ADDRESS
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/EUSEND_FROM_ADDRESS'
            - Name: UPSTASH_REDIS_REST_URL
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/UPSTASH_REDIS_REST_URL'
            - Name: UPSTASH_REDIS_REST_TOKEN
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/UPSTASH_REDIS_REST_TOKEN'

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: api

  # ─── Task Definition 2: Standalone Worker (BullMQ consumer) ──────────────────
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: codeward-worker
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: codeward-worker
          Image: !Ref ImageUri
          Essential: true
          Command:
            - node
            - dist/worker.js
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: SKIP_SECRET_VALIDATION
              Value: 'true'
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: REDIS_URL
              Value: !Ref RedisUrl
            - Name: UPSTASH_REDIS_URL
              Value: !Ref RedisUrl
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
            - Name: WORKER_CONCURRENCY
              Value: '5'
            - Name: AI_ENGINE
              Value: bedrock
            - Name: BEDROCK_REGION
              Value: 'us-east-1'
            - Name: SANDBOX_PROVIDER
              Value: 'e2b'
            - Name: FRONTEND_URL
              Value: !Ref FrontendUrl
            - Name: API_URL
              Value: !Ref ApiUrl
          Secrets:
            - Name: GITHUB_APP_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_APP_ID'
            - Name: GITHUB_CLIENT_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_CLIENT_ID'
            - Name: GITHUB_CLIENT_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_CLIENT_SECRET'
            - Name: GITHUB_WEBHOOK_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_WEBHOOK_SECRET'
            - Name: GITHUB_PRIVATE_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/GITHUB_PRIVATE_KEY'
            - Name: BETTER_AUTH_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/BETTER_AUTH_SECRET'
            - Name: FLY_API_TOKEN
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/FLY_API_TOKEN'
            - Name: E2B_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/E2B_API_KEY'
            - Name: OPENAI_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/OPENAI_API_KEY'
            - Name: AGENTROUTER_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/AGENTROUTER_API_KEY'
            - Name: TOKENROUTER_BASE_URL
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_BASE_URL'
            - Name: TOKENROUTER_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_API_KEY'
            - Name: TOKENROUTER_MODEL
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_MODEL'
            - Name: TOKENROUTER_GLM_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_GLM_API_KEY'
            - Name: TOKENROUTER_GPT_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/TOKENROUTER_GPT_API_KEY'
            - Name: FALLOW_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/FALLOW_API_KEY'
            - Name: FALLOW_API_ENDPOINT
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/FALLOW_API_ENDPOINT'
            - Name: POLAR_ACCESS_TOKEN
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_ACCESS_TOKEN'
            - Name: POLAR_ORGANIZATION_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_ORGANIZATION_ID'
            - Name: POLAR_WEBHOOK_SECRET
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_WEBHOOK_SECRET'
            - Name: POLAR_TEAM_PRODUCT_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_TEAM_PRODUCT_ID'
            - Name: POLAR_PRO_PRODUCT_ID
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/POLAR_PRO_PRODUCT_ID'
            - Name: RESEND_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/RESEND_API_KEY'
            - Name: BREVO_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/BREVO_API_KEY'
            - Name: QUICKEMAILVERIFICATION_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/QUICKEMAILVERIFICATION_API_KEY'
            - Name: EUSEND_API_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/EUSEND_API_KEY'
            - Name: EUSEND_FROM_ADDRESS
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/EUSEND_FROM_ADDRESS'
            - Name: UPSTASH_REDIS_REST_URL
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/UPSTASH_REDIS_REST_URL'
            - Name: UPSTASH_REDIS_REST_TOKEN
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/codeward/prod/UPSTASH_REDIS_REST_TOKEN'

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: worker

  # ─── ECS Service 1: API (Attached to ALB Target Group) ───────────────────────
  ApiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: codeward-api
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref EcsTasksSecurityGroup
      LoadBalancers:
        - ContainerName: codeward-api
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroupArn

  # ─── ECS Service 2: Worker (Decoupled from ALB, scales independently) ────────
  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: codeward-worker
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref EcsTasksSecurityGroup
